version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: plagiscan-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: plagiscan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: plagiscan-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
